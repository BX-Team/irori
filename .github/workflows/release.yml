name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.2.3)
        required: true
        type: string
      description:
        description: "Optional summary for the top of the release notes. Use \\n for a line break."
        required: false
        default: ""
        type: string
      prerelease:
        description: Mark the release as a pre-release
        default: false
        type: boolean
      draft:
        description: Leave the release as a draft instead of publishing it
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the version and find the previous tag
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "previous=$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run the tests
        run: go test ./...

      - name: Lint with golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  tag:
    name: Tag the release
    needs: [prepare, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set the version in flake.nix
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          sed -i '/pname = "irori";/,/version = / s/version = "[^"]*";/version = "'"$VERSION"'";/' flake.nix
          sed -i 's/main\.version=[^"]*/main.version='"$VERSION"'/' flake.nix
          grep -q "version = \"$VERSION\";" flake.nix
          grep -q "main.version=$VERSION" flake.nix

      - name: Commit the bump and push the tag
        id: push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.nix
          git commit -m "chore(release): bump version to $VERSION"
          git tag -a "$TAG" -m "$VERSION"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --draft \
            --title "irori $VERSION" \
            --notes "Assets are still uploading."

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }})
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build the binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          binary="irori"
          if [ "$GOOS" = "windows" ]; then binary="irori.exe"; fi
          go build -v -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o "dist/$binary" ./cmd/irori

      - name: Package the archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        shell: bash
        run: |
          suffix="$GOOS-$GOARCH"
          if [ -n "$GOARM" ]; then suffix="$suffix-v$GOARM"; fi
          cp README.md LICENSE dist/
          cd dist
          if [ "$GOOS" = "windows" ]; then
            asset="irori-$suffix.zip"
            zip -9 -r "../$asset" .
          else
            asset="irori-$suffix.tar.gz"
            tar -czf "../$asset" .
          fi
          cd ..
          sha256sum "$asset" | awk '{print $1}' > "$asset.sha256"

      - name: Upload the assets to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: gh release upload "$TAG" irori-*.tar.gz irori-*.zip irori-*.sha256 --clobber

  cachix:
    name: Push to Cachix
    needs: [tag]
    if: ${{ ! inputs.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: bx-team
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and push the flake package
        run: nix build --print-build-logs .#irori

  publish:
    name: Publish the release
    needs: [prepare, tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          printf 'attached:\n%s\n\n' "$have"
          missing=0
          for asset in \
            "irori-linux-amd64.tar.gz" \
            "irori-linux-arm64.tar.gz" \
            "irori-linux-arm-v7.tar.gz" \
            "irori-darwin-amd64.tar.gz" \
            "irori-darwin-arm64.tar.gz" \
            "irori-windows-amd64.zip" \
            "irori-windows-arm64.zip" \
            "irori-freebsd-amd64.tar.gz"; do
            for name in "$asset" "$asset.sha256"; do
              if ! printf '%s\n' "$have" | grep -qxF "$name"; then
                echo "::error::missing release asset '$name'"
                missing=1
              fi
            done
          done
          exit "$missing"

      - name: Build the changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: .github/changelog_configuration.json
          mode: COMMIT
          fromTag: ${{ needs.prepare.outputs.previous }}
          toTag: ${{ needs.prepare.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose the release body
        env:
          DESCRIPTION: ${{ inputs.description }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        shell: bash
        run: |
          if [ -n "$(printf '%s' "$DESCRIPTION" | tr -d '[:space:]')" ]; then
            {
              echo '## 📑 Changelog'
              echo
              # %b so a '\n' typed into the dispatch field becomes a real line
              # break — GitHub renders that input as a single-line box.
              printf '%b\n' "$DESCRIPTION"
              echo
              printf '%s\n' "$CHANGELOG" | sed 's/^## /### /'
            } >body.md
          else
            printf '%s\n' "$CHANGELOG" >body.md
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          gh release edit "$TAG" \
            --title "irori $VERSION" \
            --notes-file body.md \
            --draft="$DRAFT" \
            --prerelease="$PRERELEASE" \
            --latest="$([ "$PRERELEASE" = 'true' ] && echo false || echo true)"

      - name: Write the result to the run summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          {
            echo "## [$TAG]($URL)"
            echo
            echo '| Asset |'
            echo '| --- |'
            gh release view "$TAG" --json assets --jq '.assets[].name' \
              | grep -v '[.]sha256$' \
              | awk '{ printf "| `%s` |\n", $0 }'
            echo
            cat body.md
          } >> "$GITHUB_STEP_SUMMARY"
